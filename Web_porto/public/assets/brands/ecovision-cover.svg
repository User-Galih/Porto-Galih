<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="cvCanvas" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071118"/>
      <stop offset="50%" stop-color="#0B1924"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="cvCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#112230"/>
      <stop offset="100%" stop-color="#0D1822"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#cvCanvas)"/>
  <!-- Subtle technical grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.55">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <!-- Left Input & Grad-CAM Vision Frame -->
  <rect x="44" y="52" width="310" height="346" rx="18" fill="url(#cvCard)" stroke="#10B981" stroke-opacity="0.45" stroke-width="2"/>
  <text x="68" y="88" fill="#6EE7B7" font-family="sans-serif" font-size="13" font-weight="700">INPUT TENSOR · 224x224 RGB</text>
  <rect x="68" y="106" width="262" height="196" rx="12" fill="#061017" stroke="#1E293B" stroke-width="1.5"/>
  <!-- Bounding box detection reticle -->
  <rect x="102" y="130" width="194" height="148" rx="8" stroke="#10B981" stroke-width="2.5" stroke-dasharray="8 5"/>
  <rect x="102" y="112" width="142" height="22" rx="4" fill="#10B981"/>
  <text x="110" y="127" fill="#042F1E" font-family="monospace" font-size="11" font-weight="700">PLASTIC_PET: 94.8%</text>
  <circle cx="199" cy="204" r="44" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-width="2"/>
  <path d="M180 204L194 218L222 190" stroke="#ECFDF5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="68" y="334" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="700">EfficientNetV2B0 Fine-Tuned</text>
  <text x="68" y="358" fill="#94A3B8" font-family="sans-serif" font-size="12">12 Waste Categories · Macro F1 92.8%</text>
  <text x="68" y="378" fill="#34D399" font-family="monospace" font-size="12">CPU Latency: 120ms · Docker Multi-Stage</text>

  <!-- Connector Arrow -->
  <path d="M364 225H416" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
  <path d="M408 217L418 225L408 233" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right FastAPI + Confidence Telemetry Panel -->
  <rect x="428" y="52" width="328" height="346" rx="18" fill="url(#cvCard)" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="2"/>
  <text x="454" y="88" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="700">FASTAPI + STREAMLIT INFERENCE</text>
  <!-- Confidence Bars -->
  <text x="454" y="128" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">1. Recyclable Plastic (PET)</text>
  <rect x="454" y="138" width="276" height="12" rx="6" fill="#1E293B"/>
  <rect x="454" y="138" width="256" height="12" rx="6" fill="#10B981"/>
  <text x="454" y="182" fill="#94A3B8" font-family="sans-serif" font-size="12">2. Clear Glass Container (3.4%)</text>
  <rect x="454" y="192" width="276" height="10" rx="5" fill="#1E293B"/>
  <rect x="454" y="192" width="28" height="10" rx="5" fill="#38BDF8"/>
  <text x="454" y="232" fill="#94A3B8" font-family="sans-serif" font-size="12">3. Cardboard / Paper (1.8%)</text>
  <rect x="454" y="242" width="276" height="10" rx="5" fill="#1E293B"/>
  <rect x="454" y="242" width="16" height="10" rx="5" fill="#64748B"/>
  <!-- Disposal Recommendation Box -->
  <rect x="454" y="278" width="276" height="94" rx="12" fill="#06281E" stroke="#10B981" stroke-opacity="0.4"/>
  <text x="472" y="304" fill="#6EE7B7" font-family="sans-serif" font-size="12" font-weight="700">ACTIONABLE DISPOSAL SOP</text>
  <text x="472" y="328" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="600">Bin: Anorganik Daur Ulang (Kuning)</text>
  <text x="472" y="350" fill="#A7F3D0" font-family="sans-serif" font-size="11">Bilas botol, lepaskan tutup &amp; tekan pipih</text>
</svg>
